name: build

on:
  push:
    branches: [master]
    paths:
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "main.go"
      - "main_test.go"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # The only place the image version comes from: the tailscale.com module
      # version in go.mod. Dependabot (ecosystem: gomod) watches it and opens a
      # bump PR. Merging the PR -> this workflow builds and publishes the image
      # to GHCR -> Watchtower on the Pi picks it up via the `latest` tag.
      - name: Read tailscale version from go.mod
        id: ver
        run: echo "version=$(go list -m -f '{{.Version}}' tailscale.com)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/wuxriff/hypertail:${{ steps.ver.outputs.version }}
            ghcr.io/wuxriff/hypertail:latest
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
